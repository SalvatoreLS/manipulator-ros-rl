[develop]
script_dir=$base/lib/distance_based_rl
[install]
install_scripts=$base/lib/distance_based_rl

[flake8]
# Deviations from the ament defaults, each a deliberate style choice rather than
# unfixed debt.  Everything else is enforced; `pytest test/test_flake8.py` is green.
#
#   E221 / E251  columns of related assignments and keyword arguments are aligned
#                (e.g. the normalisation scales in State, the settle parameters in
#                _wait_until_settled).  The alignment is the point — it makes a block
#                of related constants readable as a table.
#   E402         train.py filters a torch CUDA warning *before* importing torch, and
#                the tests extend sys.path before importing the package; both imports
#                must come after that setup.
extend-ignore = E221,E251,E402
max-line-length = 130
exclude = .git,__pycache__,build,install,log
